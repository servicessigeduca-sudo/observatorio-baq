name: Límites de barrios

# Descarga de OpenStreetMap los polígonos de barrios para el mapa por barrio
# (data/publico/barrios.geojson). Corre cuando cambia el script o los alias,
# el primer día de cada mes, o a mano.
on:
  push:
    paths: ["publico/limites_barrios.py", "data/barrios_alias.json", "data/barrios_pot.geojson", ".github/workflows/barrios.yml"]
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barrios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt shapely
      - name: Descargar límites
        run: python -m publico.limites_barrios | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publico/barrios.geojson
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar límites de barrios ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
