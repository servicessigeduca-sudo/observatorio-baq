name: Histórico oficial

# Descarga una sola vez los archivos por delito y año de la Policía (2010-2019) y
# guarda los conteos del área metropolitana en data/oficiales_historico.json.
# Se incluye 2020 para comparar con el archivo a nivel de registro de ese año.
# Al terminar, "Datos oficiales" vuelve a correr y une el histórico.
on:
  push:
    branches: [main, secciones]
    paths: ["oficiales/historico.py", ".github/workflows/historico.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oficiales
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar y agregar
        run: python -m oficiales.historico --anios 2010-2020 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oficiales_historico.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar histórico oficial ($(date -u +%Y-%m-%d))"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
