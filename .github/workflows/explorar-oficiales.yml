name: Explorar datos oficiales
on:
  push:
    branches: [datos-oficiales]
    paths: ["oficiales/**", ".github/workflows/explorar-oficiales.yml"]
permissions:
  contents: read
jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pandas openpyxl
      - run: python oficiales/explorar.py
