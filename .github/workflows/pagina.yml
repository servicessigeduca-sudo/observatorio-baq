name: Página

# Ubica los casos en el mapa y publica la página en GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["web/**", "casos/**", "data/**", ".github/workflows/pagina.yml"]
  workflow_run:
    workflows: [Scraper, Datos oficiales]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: false

jobs:
  construir:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Agrupar notas y ubicar barrios
        run: |
          python -m casos --geocodificar --reporte reporte-casos.md > /dev/null
          cat reporte-casos.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar casos y ubicaciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/casos.json data/geocodigos.json
          git diff --cached --quiet && exit 0
          git commit -m "Ubicar casos en el mapa ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
      - name: Armar el sitio
        run: |
          mkdir -p _site/data
          cp web/* _site/
          cp data/casos.json _site/data/
          cp data/oficiales.json data/oficiales_mensual.csv _site/data/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
