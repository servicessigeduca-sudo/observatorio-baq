name: Scraper

on:
  schedule:
    - cron: "0 11 * * *" # 6:00 a. m. en Barranquilla
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes separadas por coma (vacío = todas): zona-cero, la-libertad, emisora-atlantico, impacto-news, ctv"
        required: false
        default: ""
      guardar:
        description: "Guardar las notas nuevas en data/notas.json del repositorio"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Correr el scraper
        env:
          FUENTES: ${{ inputs.fuentes }}
        run: |
          if [ -n "$FUENTES" ]; then
            python -m scraper -v --fuentes "$FUENTES" | tee resumen.txt
          else
            python -m scraper -v | tee resumen.txt
          fi
          cat resumen.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Agrupar notas en casos
        run: |
          python -m casos --reporte reporte-casos.md > /dev/null
          cat reporte-casos.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: notas
          path: |
            data/notas.json
            data/casos.json
      - name: Guardar en el repositorio
        # La corrida diaria siempre guarda; la manual solo si se marca "guardar".
        if: ${{ github.event_name == 'schedule' || inputs.guardar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notas.json data/casos.json
          git diff --cached --quiet && echo "Sin notas nuevas" && exit 0
          git commit -m "Actualizar notas y casos ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
