name: Explorar fuentes (temporal)
on:
  push:
    branches: [secciones]
    paths: [.github/workflows/explorar.yml]
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests beautifulsoup4
      - run: |
          python3 - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          from urllib.parse import unquote, urljoin
          s = requests.Session(); s.headers["User-Agent"] = "ObservatorioBAQ"
          for base in ["https://www.policia.gov.co/estadistica-delictiva", "https://www.policia.gov.co/estadistica-delictiva-old"]:
              vistos = []
              for p in range(0, 60):
                  try:
                      h = s.get(base + (f"?page={p}" if p else ""), timeout=60).text
                  except Exception as e:
                      print(base, p, "err", e); break
                  nuevos = [unquote(a["href"]) for a in BeautifulSoup(h, "html.parser").find_all("a", href=True) if re.search(r"\.(xlsx?|zip|csv)$", a["href"], re.I)]
                  nuevos = [n for n in nuevos if n not in vistos]
                  if not nuevos: break
                  vistos += nuevos
              print("##", base, len(vistos))
              for v in vistos: print("  ", v.rsplit("/",1)[-1])
          PY
      - run: |
          python3 - <<'PY'
          import requests
          for i in ["d4fr-sbn2", "vuyt-mqpw", "72sg-cybi"]:
              r = requests.get(f"https://www.datos.gov.co/resource/{i}.json", params={"$limit": 2}, timeout=120)
              print(i, r.status_code, r.text[:600])
              r = requests.get(f"https://www.datos.gov.co/resource/{i}.json", params={"$select": "min(fecha_hecho) as a, max(fecha_hecho) as b, count(*) as n"}, timeout=300)
              print("  ", r.status_code, r.text[:400])
          PY
